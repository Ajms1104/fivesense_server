# .github/workflows/ci.yml (최후의 최종 완성본)
name: CI/CD for Frontend and Backend

on:
  push:
    branches:
      - main

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend 
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fivesense-frontend:latest


  build-backend:
    runs-on: ubuntu-latest
    steps:
      # 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3
        
      # Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      # Docker 빌드 & 푸시 (Dockerfile이 스스로 빌드하므로, Gradle 관련 단계 불필요)
      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./fivesense
          file: ./fivesense/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fivesense:latest
